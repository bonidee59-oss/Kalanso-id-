<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CartesID BF — Cartes d'identité scolaires</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F5C3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CartesID BF">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png">
<style>
:root{
  --rouge:#CE1126; --vert:#009E49; --or:#FCD116;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EEF0F3;
  --ink:#1B2430; --ink-soft:#5A6472; --line:#DDE1E7;
  --accent:#0F5C3E; --accent-2:#8A6D00;
  --danger:#B3261E; --radius:12px; --shadow:0 2px 10px rgba(20,25,35,.07);
  --font-ui:'Segoe UI',-apple-system,Roboto,Arial,sans-serif;
  --font-disp:Georgia,'Times New Roman',serif;
}
[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2029; --surface-2:#222937;
  --ink:#EAEDF2; --ink-soft:#9AA5B4; --line:#2B3341;
  --accent:#2FBE84; --accent-2:#E4C441;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:14px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:9px;border:1px solid transparent;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;}
.btn:hover{filter:brightness(1.08);}
.btn.wide{width:100%;justify-content:center;padding:12px;}
.btn.secondary{background:var(--surface-2);color:var(--ink);border-color:var(--line);}
.btn.danger{background:var(--danger);}
.btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100vh;}
#app.show{display:flex;}
#sidebar{width:238px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;}
.sbBrand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line);}
.sbBrand svg{width:30px;height:30px;flex:none;}
.sbBrand div b{display:block;font-size:14px;font-family:var(--font-disp);}
.sbBrand div span{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
#navList{flex:1;overflow-y:auto;padding:10px 8px;}
.navItem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-bottom:2px;}
.navItem svg{width:17px;height:17px;flex:none;}
.navItem:hover{background:var(--surface-2);color:var(--ink);}
.navItem.active{background:var(--accent);color:#fff;}
.sbFoot{padding:12px;border-top:1px solid var(--line);}
#mainCol{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{height:58px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;}
#topSearch{flex:1;max-width:380px;position:relative;}
#topSearch input{width:100%;padding:8px 12px 8px 34px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;}
#topSearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);}
.topSpacer{flex:1;}
.iconBtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent;color:var(--ink-soft);position:relative;}
.iconBtn:hover{background:var(--surface-2);}
.iconBtn svg{width:18px;height:18px;}
.badgeDot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--rouge);}
.profileChip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;background:var(--surface-2);}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.profileChip .who{font-size:12px;line-height:1.2;}
.profileChip .who b{display:block;font-size:12.5px;}
.profileChip .who span{color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;}
#viewArea{flex:1;overflow-y:auto;padding:22px 26px 60px;}
.view{display:none;animation:fadein .18s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.viewHead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.viewHead h2{font-family:var(--font-disp);font-size:23px;margin:0 0 4px;}
.viewHead p{margin:0;color:var(--ink-soft);font-size:13px;}
.viewActions{display:flex;gap:8px;flex-wrap:wrap;}

/* generic components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:18px;}
.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
.kpi{padding:16px 18px;}
.kpi .n{font-size:26px;font-weight:700;font-family:var(--font-disp);}
.kpi .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.kpi .icn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.kpi .icn svg{width:17px;height:17px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px 12px;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);}
td{padding:9px 12px;border-bottom:1px solid var(--line);}
tr:hover td{background:var(--surface-2);}
/* Sur mobile, les 2 premières colonnes (photo + nom) restent visibles au défilement horizontal */
#stuTable th:nth-child(1), #stuTable td:nth-child(1){position:sticky;left:0;z-index:2;background:var(--surface);width:56px;}
#stuTable th:nth-child(2), #stuTable td:nth-child(2){position:sticky;left:56px;z-index:2;background:var(--surface);box-shadow:4px 0 6px -4px rgba(0,0,0,.18);}
#stuTable thead th:nth-child(1), #stuTable thead th:nth-child(2){z-index:3;}
#stuTable tr:hover td:nth-child(1), #stuTable tr:hover td:nth-child(2){background:var(--surface-2);}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.chip.ok{background:#0F5C3E22;color:var(--accent);}
.chip.warn{background:#8A6D0022;color:var(--accent-2);}
.chip.off{background:var(--surface-2);color:var(--ink-soft);}
.rowBtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;margin-right:4px;}
.rowBtn svg{width:13px;height:13px;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;}
.pill{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.empty{padding:50px 20px;text-align:center;color:var(--ink-soft);}
.empty svg{width:46px;height:46px;opacity:.35;margin-bottom:10px;}

/* modal */
.modalBg{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:center;justify-content:center;z-index:400;padding:20px;}
.modalBg.show{display:flex;}
.modal{background:var(--surface);border-radius:16px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.4);}
.modalHead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;}
.modalHead h3{margin:0;font-family:var(--font-disp);font-size:17px;}
.modalBody{padding:20px;}
.modalFoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);}
.closeX{width:30px;height:30px;border-radius:50%;border:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
.closeX svg{width:14px;height:14px;}

/* toast */
#toastHost{position:fixed;bottom:18px;right:18px;z-index:600;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;animation:toastin .2s ease;}
[data-theme="dark"] .toast{background:var(--surface-2);border:1px solid var(--line);}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* card canvas + editor layout */
.cardStage{display:flex;gap:22px;flex-wrap:wrap;}
.cardPreviewCol{flex:1;min-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.cardCanvasWrap{background:repeating-conic-gradient(var(--surface-2) 0% 25%, var(--surface) 0% 50%) 0/16px 16px;padding:16px;border-radius:14px;border:1px solid var(--line);}
canvas.cardCanvas{border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.18);display:block;max-width:100%;height:auto;}
.editorCol{width:330px;flex:none;}
.editorCol .card{padding:16px;}
.editorCol h4{margin:0 0 10px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
.editorSection{margin-bottom:18px;}
.swatchRow{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;}
input[type=color]{width:38px;height:30px;border:none;padding:0;border-radius:7px;background:none;}
.rangeRow{display:flex;align-items:center;gap:10px;}
.rangeRow input[type=range]{flex:1;}
.uploadBox{border:1.5px dashed var(--line);border-radius:9px;padding:10px;text-align:center;font-size:12px;color:var(--ink-soft);cursor:pointer;}
.uploadBox:hover{border-color:var(--accent);}
.tplGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.tplThumb{border:2px solid var(--line);border-radius:9px;padding:8px;cursor:pointer;text-align:center;font-size:11.5px;font-weight:600;transition:box-shadow .15s, transform .15s;overflow:hidden;}
.tplThumb:hover{box-shadow:0 6px 16px rgba(0,0,0,.12);transform:translateY(-1px);}
.tplThumb.active{border-color:var(--accent);background:var(--accent)15;}
.tplThumb .sw{height:32px;border-radius:5px;margin-bottom:6px;}
.docThumb{border-radius:7px;overflow:hidden;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.10);}
.docThumb img{display:block;}

/* login role select buttons in dashboard etc */
.studentPhoto{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--surface-2);}
.checklistItem{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;}
.progressBar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.progressBar > div{height:100%;background:var(--accent);width:0%;transition:width .2s;}

/* ---- Module Documents Professionnels (indépendant) ---- */
.deTopbar{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap;}
.deTopbar #de_title{flex:none;width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;}
.deTopActions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto;}
.deSep{width:1px;height:22px;background:var(--line);margin:0 4px;}
.iconBtn2{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-size:14px;display:flex;align-items:center;justify-content:center;}
.iconBtn2:hover{background:var(--line);}
.deBody{display:flex;border:1px solid var(--line);border-top:none;min-height:560px;background:var(--surface);}
.deToolbar{width:78px;flex:none;border-right:1px solid var(--line);padding:10px 6px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
.deToolBtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink-soft);font-size:9.5px;}
.deToolBtn:hover{background:var(--surface-2);color:var(--ink);}
.deToolBtn span{line-height:1;}
.deStageWrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px;background:repeating-conic-gradient(var(--surface-2) 0% 25%, var(--bg) 0% 50%) 0/16px 16px;}
.deStageWrap canvas{background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18);touch-action:none;}
.deProps{width:250px;flex:none;border-left:1px solid var(--line);padding:14px;overflow-y:auto;}
.deProps h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
.dePages{display:flex;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);}
@media(max-width:1000px){
  .deBody{flex-direction:column;}
  .deToolbar{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;}
  .deProps{width:100%;border-left:none;border-top:1px solid var(--line);}
}

@media(max-width:880px){
  #sidebar{position:fixed;left:-238px;top:0;bottom:0;z-index:300;transition:left .2s;}
  #sidebar.open{left:0;}
  .cardStage{flex-direction:column;}
  .editorCol{width:100%;}
  /* La carte reste visible en haut pendant qu'on fait défiler les réglages en dessous */
  .cardPreviewCol{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin:0 -4px;gap:8px;}
  .cardCanvasWrap{padding:8px;}
  .cardCanvas{width:260px!important;}
}
</style>
</head>
<body>

<!-- ======================= APP ======================= -->
<div id="app">
  <aside id="sidebar">
    <div class="sbBrand">
      <svg viewBox="0 0 48 48"><g class="brandMarkSm"></g></svg>
      <div><b>CartesID BF</b><span>Établissement scolaire</span></div>
    </div>
    <nav id="navList"></nav>
    <div class="sbFoot"></div>
  </aside>

  <div id="mainCol">
    <div id="topbar">
      <button class="iconBtn" id="btnBurger" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div id="topSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Rechercher un élève, une classe, un matricule…">
      </div>
      <div class="topSpacer"></div>
      <button class="iconBtn" id="btnTheme" title="Mode clair / sombre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4.2"/></svg></button>
      <button class="iconBtn" id="btnNotif" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M9.5 21a2.5 2.5 0 005 0"/></svg><span class="badgeDot" id="notifDot" style="display:none"></span></button>
      <div class="profileChip">
        <div class="avatar" id="avatarInit">A</div>
        <div class="who"><b id="profName">—</b><span id="profRole">—</span></div>
      </div>
    </div>
    <div id="viewArea"></div>
  </div>
</div>

<div id="toastHost"></div>

<div class="modalBg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="modalBg" id="modalBg2" style="z-index:450;"><div class="modal" id="modalBox2"></div></div>

<script id="privacy-policy-module">
(function(){
  function pp_text(){
    var etab = "";
    try {
      var school = DB.get(DB.KEYS.school);
      if (school && school.nom) etab = school.nom;
    } catch(e){}
    var titre = etab ? ("Politique de confidentialité — " + etab) : "Politique de confidentialité";
    var maj = new Date().toLocaleDateString("fr-FR", { year: "numeric", month: "long", day: "numeric" });

    var html = "";
    html += "<h4 style=\"margin-top:0;\">" + escapeHtml(titre) + "</h4>";
    html += "<p style=\"color:var(--ink-soft);font-size:12px;\">Dernière consultation : " + escapeHtml(maj) + "</p>";

    html += "<p>CartesID BF est une application installée localement (PWA hors-ligne) destinée à la gestion des cartes d'identité scolaires. Cette politique explique quelles données sont traitées, où elles sont stockées et comment elles sont protégées.</p>";

    html += "<h4>1. Responsable du traitement</h4>";
    html += "<p>L'établissement scolaire qui installe et utilise l'application (" + (etab ? escapeHtml(etab) : "l'établissement identifié dans les paramètres de l'école") + ") est seul responsable des données saisies. L'éditeur de l'application n'héberge, ne consulte ni ne reçoit aucune de ces données.</p>";

    html += "<h4>2. Données traitées</h4>";
    html += "<ul style=\"padding-left:18px;margin:6px 0;\">";
    html += "<li>Identité de l'élève : nom, prénom(s), sexe, date et lieu de naissance, classe, matricule</li>";
    html += "<li>Photo d'identité de l'élève</li>";
    html += "<li>Coordonnées : adresse, téléphone du parent/tuteur, personne et téléphone d'urgence</li>";
    html += "<li>Informations scolaires : établissement, année scolaire, numéro PV, groupe sanguin (facultatif), informations liées au CEP le cas échéant</li>";
    html += "<li>Compte utilisateur de l'application (identifiant, mot de passe chiffré, rôle) pour le personnel autorisé</li>";
    html += "<li>Historique des actions effectuées dans l'application (journal d'activité local)</li>";
    html += "</ul>";

    html += "<h4>3. Stockage des données</h4>";
    html += "<p>Toutes les données ci-dessus sont enregistrées uniquement dans la mémoire locale de l'appareil ou du navigateur utilisé (stockage local du navigateur). Aucune donnée n'est envoyée à un serveur distant ni à l'éditeur de l'application. L'application fonctionne hors-ligne : les données restent sur l'appareil qui les a saisies, sauf action volontaire d'export réalisée par un utilisateur (voir point 5).</p>";

    html += "<h4>4. Carte d'identité et QR code</h4>";
    html += "<p>Les cartes générées peuvent inclure un QR code reprenant certaines informations de l'élève (nom, prénom, classe, numéro de carte, etc.) afin de faciliter une vérification visuelle de la carte imprimée. Ce QR code est généré localement et n'est associé à aucun service en ligne.</p>";

    html += "<h4>5. Partage et export volontaires</h4>";
    html += "<p>Les fonctions d'export (PDF, PNG, ZIP), d'impression et de partage (par exemple via WhatsApp) sont déclenchées uniquement par une action manuelle d'un utilisateur autorisé. L'établissement reste responsable de la diffusion des fichiers ainsi produits et doit veiller à ne les transmettre qu'aux personnes autorisées (impression des cartes, direction, parents concernés).</p>";

    html += "<h4>6. Sécurité</h4>";
    html += "<ul style=\"padding-left:18px;margin:6px 0;\">";
    html += "<li>L'accès à l'application est protégé par un identifiant et un mot de passe propres à chaque utilisateur ; les mots de passe sont stockés sous forme chiffrée (hachage), jamais en clair</li>";
    html += "<li>Un code d'activation lié à l'appareil est requis avant toute utilisation</li>";
    html += "<li>Il est recommandé de réserver l'accès à l'appareil hébergeant l'application au personnel autorisé de l'établissement</li>";
    html += "</ul>";

    html += "<h4>7. Conservation et suppression des données</h4>";
    html += "<p>Les données sont conservées tant qu'elles restent utiles à la gestion des cartes scolaires, ou jusqu'à leur suppression manuelle par un utilisateur autorisé (suppression d'un élève, réinitialisation de l'application, désinstallation ou effacement des données du navigateur/appareil).</p>";

    html += "<h4>8. Droits des personnes concernées</h4>";
    html += "<p>Les parents, tuteurs ou élèves majeurs peuvent, auprès de l'établissement, demander l'accès aux informations les concernant, leur rectification ou leur suppression. Ces demandes doivent être adressées directement à l'établissement scolaire, seul détenteur des données.</p>";

    html += "<h4>9. Modifications</h4>";
    html += "<p>Cette politique peut être mise à jour au fil des évolutions de l'application. La version affichée ici reflète le fonctionnement actuel de l'application.</p>";

    return html;
  }

  function openPrivacyPolicy(){
    var body = "<div class=\"modalHead\"><h3>Politique de confidentialité</h3>"
      + "<button class=\"closeX\" onclick=\"closeModal()\">" + icon("x", 13) + "</button></div>"
      + "<div class=\"modalBody\" style=\"max-height:65vh;overflow-y:auto;font-size:13px;line-height:1.55;\">"
      + pp_text()
      + "</div>";
    openModal(body);
  }
  window.openPrivacyPolicy = openPrivacyPolicy;

  var _origRenderSettings = renderSettings;
  renderSettings = function(container){
    _origRenderSettings(container);
    try {
      var card = document.createElement("div");
      card.className = "card pad";
      card.style.marginTop = "18px";
      card.innerHTML = "<h4 style=\"margin-top:0;font-size:13px;color:var(--ink-soft);text-transform:uppercase;\">Confidentialité</h4>"
        + "<p style=\"color:var(--ink-soft);font-size:12.5px;\">Consultez la politique de confidentialité de l'application concernant les données des élèves et du personnel.</p>"
        + "<button class=\"btn wide\" id=\"btnPrivacyPolicy\" type=\"button\">" + icon("docs", 14) + " Politique de confidentialité</button>";
      container.appendChild(card);
      var btn = document.getElementById("btnPrivacyPolicy");
      if (btn) btn.addEventListener("click", openPrivacyPolicy);
    } catch(e) {}
  };
})();
</script>
<script id="activation-backup-module">
(function(){
  function getActivationRecord(){
    try { return DB.get(DB.KEYS.activation) || null; } catch(e){ return null; }
  }

  function downloadJSON(obj, filename){
    try {
      var blob = new Blob([JSON.stringify(obj, null, 2)], {type: "application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    } catch(e) {
      toast("Impossible de créer le fichier", "error");
    }
  }

  function exportActivation(){
    var rec = getActivationRecord();
    var deviceId = getOrCreateDeviceId();
    if (!rec || rec.deviceId !== deviceId) {
      toast("Cet appareil n'est pas encore activé", "error");
      return;
    }
    var payload = {
      type: "cartesid-bf-activation-backup",
      deviceId: rec.deviceId,
      code: rec.code,
      activatedAt: rec.activatedAt || Date.now(),
      exportedAt: Date.now()
    };
    var etab = "";
    try {
      var school = DB.get(DB.KEYS.school);
      if (school && school.nom) etab = school.nom;
    } catch(e){}
    var safeName = (etab || "appareil").toString().replace(/[^A-Za-z0-9_-]+/g, "_").slice(0, 40) || "appareil";
    downloadJSON(payload, "activation_" + safeName + ".json");
    toast("Fichier d'activation exporté");
  }

  function restoreFromFile(file, onDone){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); } catch(e) { data = null; }
      if (!data || !data.deviceId || !data.code) {
        toast("Fichier d'activation invalide", "error");
        if (onDone) onDone(false);
        return;
      }
      try {
        DB.set(DB.KEYS.deviceId, data.deviceId);
        DB.set(DB.KEYS.activation, {
          deviceId: data.deviceId,
          code: data.code,
          activatedAt: data.activatedAt || Date.now()
        });
      } catch(e) {
        toast("Impossible d'enregistrer l'activation", "error");
        if (onDone) onDone(false);
        return;
      }
      if (onDone) onDone(true);
    };
    reader.onerror = function(){
      toast("Lecture du fichier impossible", "error");
      if (onDone) onDone(false);
    };
    reader.readAsText(file);
  }

  // --- Settings screen: add an "Export" card ---
  var _origRenderSettings2 = renderSettings;
  renderSettings = function(container){
    _origRenderSettings2(container);
    try {
      var card = document.createElement("div");
      card.className = "card pad";
      card.style.marginTop = "18px";
      card.innerHTML = "<h4 style=\"margin-top:0;font-size:13px;color:var(--ink-soft);text-transform:uppercase;\">Sauvegarde de l'activation</h4>"
        + "<p style=\"color:var(--ink-soft);font-size:12.5px;\">En cas de panne, de perte ou de changement de téléphone, exportez ce fichier et conservez-le en lieu sûr (clé USB, email, cloud). S'il s'agit du même appareil réinstallé, il permettra de réactiver l'application sans redemander de code à l'administrateur.</p>"
        + "<button class=\"btn wide\" id=\"btnExportActivation\" type=\"button\">" + icon("download", 14) + " Exporter mon activation</button>";
      container.appendChild(card);
      var btn = document.getElementById("btnExportActivation");
      if (btn) btn.addEventListener("click", exportActivation);
    } catch(e) {}
  };

  // --- Activation screen: add a "Restore" option ---
  var _origRenderActivationScreen = renderActivationScreen;
  renderActivationScreen = function(){
    _origRenderActivationScreen();
    try {
      var screen = document.getElementById("activationScreen");
      if (!screen) return;
      var box = screen.querySelector(".card") || screen.firstElementChild || screen;
      var wrap = document.createElement("div");
      wrap.style.marginTop = "16px";
      wrap.style.paddingTop = "14px";
      wrap.style.borderTop = "1px solid var(--line, #e5e5e5)";
      wrap.innerHTML = "<p style=\"font-size:12.5px;color:var(--ink-soft,#777);margin:0 0 8px;\">Appareil réinstallé après une panne ou une perte ? Si vous avez déjà exporté un fichier d'activation pour cet appareil, importez-le ici — aucun nouveau code ne sera nécessaire.</p>"
        + "<input type=\"file\" id=\"actRestoreFile\" accept=\"application/json\" style=\"display:none\">"
        + "<button class=\"btn secondary wide\" id=\"actRestoreBtn\" type=\"button\">" + icon("upload", 14) + " Restaurer un fichier d'activation</button>";
      box.appendChild(wrap);
      var restoreBtn = document.getElementById("actRestoreBtn");
      var restoreFile = document.getElementById("actRestoreFile");
      if (restoreBtn && restoreFile) {
        restoreBtn.addEventListener("click", function(){ restoreFile.click(); });
        restoreFile.addEventListener("change", function(ev){
          var file = ev.target.files && ev.target.files[0];
          if (!file) return;
          restoreFromFile(file, function(ok){
            restoreFile.value = "";
            if (!ok) return;
            isActivated().then(function(active){
              if (active) {
                toast("Activation restaurée");
                screen.remove();
                startApp();
              } else {
                toast("Ce fichier ne correspond pas à cet appareil", "error");
              }
            });
          });
        });
      }
    } catch(e) {}
  };
})();
</script>
<style id="narrow-screen-fix">
/* Sur les petits écrans Android (et quand la taille de police du système est augmentée),
   les formulaires en 2/3/4 colonnes (ex: fiche "Nouvel élève") devenaient trop étroits
   et le contenu des champs n'était plus lisible. On repasse sur une seule colonne. */
@media (max-width: 560px) {
  .grid.cols-2, .grid.cols-3, .grid.cols-4 {
    grid-template-columns: 1fr !important;
  }
  .modal {
    max-width: 100%;
  }
  .modalBody, .modalHead, .modalFoot {
    padding-left: 14px;
    padding-right: 14px;
  }
  .field input, .field select, .field textarea {
    font-size: 16px;
  }
  #modalBg, #modalBg2 {
    padding: 10px;
  }
}
</style>
