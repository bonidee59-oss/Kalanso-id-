name: Construire l'application Windows (CartesID BF)

# Ce fichier transforme la PWA CartesID BF en application Windows (.exe)
# avec Electron + electron-builder. Aucun autre fichier à ajouter au dépôt :
# l'enveloppe Electron (package.json, main.js) est générée pendant la construction.

on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    tags:
      - "v*"                # ex : git tag v1.0.0 -> publie une Release avec les .exe

permissions:
  contents: write           # nécessaire pour créer la Release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Préparer l'enveloppe Electron
        run: |
          mkdir -p winapp/app winapp/build

          # --- Fichiers de la PWA (à la racine du dépôt) ---
          cp index.html sw.js manifest.json winapp/app/
          cp -r icons winapp/app/icons
          cp icons/icon-512.png winapp/build/icon.png

          # --- Version : issue du tag (v1.2.3) sinon 1.0.0 ---
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="1.0.0"
          fi

          # --- package.json ---
          cat > winapp/package.json <<EOF
          {
            "name": "cartesid-bf",
            "productName": "CartesID BF",
            "version": "${APP_VERSION}",
            "description": "Création et gestion de cartes d'identité scolaires — Burkina Faso",
            "author": "Bernard Sané",
            "main": "main.js",
            "devDependencies": {
              "electron": "^33.2.0",
              "electron-builder": "^25.1.8"
            },
            "build": {
              "appId": "bf.cartesid.app",
              "productName": "CartesID BF",
              "directories": { "output": "dist", "buildResources": "build" },
              "files": ["main.js", "app/**/*", "build/icon.png"],
              "win": {
                "icon": "build/icon.png",
                "target": [
                  { "target": "nsis", "arch": ["x64"] },
                  { "target": "portable", "arch": ["x64"] }
                ]
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "perMachine": false,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true
              },
              "artifactName": "CartesID-BF-\${version}-\${target}.\${ext}"
            }
          }
          EOF

          # --- main.js ---
          cat > winapp/main.js <<'EOF'
          const { app, BrowserWindow, Menu, shell } = require('electron');
          const path = require('path');

          if (!app.requestSingleInstanceLock()) { app.quit(); }

          let win;
          function createWindow() {
            win = new BrowserWindow({
              width: 1280,
              height: 860,
              minWidth: 900,
              minHeight: 600,
              backgroundColor: '#12161C',
              title: 'CartesID BF',
              icon: path.join(__dirname, 'build', 'icon.png'),
              webPreferences: { contextIsolation: true, nodeIntegration: false }
            });
            Menu.setApplicationMenu(null);
            win.loadFile(path.join(__dirname, 'app', 'index.html'));

            // Les liens externes s'ouvrent dans le navigateur par défaut
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
          }

          app.on('second-instance', () => {
            if (win) { if (win.isMinimized()) win.restore(); win.focus(); }
          });
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
          EOF

      - name: Installer les dépendances
        working-directory: winapp
        run: npm install

      - name: Construire l'installateur Windows
        working-directory: winapp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # pas de signature de code
        run: npx electron-builder --win --publish never

      - name: Envoyer les fichiers .exe (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CartesID-BF-Windows
          path: winapp/dist/*.exe
          if-no-files-found: error

      - name: Publier une Release (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: winapp/dist/*.exe
